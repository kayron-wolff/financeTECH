<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle Financeiro</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .section { margin: 20px 0; }
    .section h2 { display: inline-block; margin-right: 10px; }
    .btn { padding: 5px 10px; cursor: pointer; }

    /* Estilo do pop-up (modal) */
    .modal {
      display: none; /* escondido por padrão */
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      width: 300px;
    }
    .close {
      float: right;
      cursor: pointer;
      color: red;
    }
  </style>
</head>
<body>

  <!-- Área de Entradas -->
  <div class="section">
    <h2>Entradas</h2>
    <button class="btn" onclick="abrirModal('entrada')">+ Adicionar</button>
  </div>

  <!-- Área de Saídas -->
  <div class="section">
    <h2>Saídas</h2>
    <button class="btn" onclick="abrirModal('saida')">+ Adicionar</button>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal()">&times;</span>
      <h3 id="modal-title"></h3>
      <form id="form">
        <label>Descrição:</label><br>
        <input type="text" name="descricao"><br><br>
        <label>Valor:</label><br>
        <input type="number" name="valor" step="0.01"><br><br>
        <label>Data:</label><br>
        <input type="date" name="data"><br><br>
        <button type="submit">Salvar</button>
      </form>
    </div>
  </div>

  <script>
    function abrirModal(tipo) {
      document.getElementById("modal").style.display = "flex";
      document.getElementById("modal-title").innerText = 
        tipo === "entrada" ? "Nova Entrada" : "Nova Saída";
    }

    function fecharModal() {
      document.getElementById("modal").style.display = "none";
    }

    // Exemplo de captura do formulário
    document.getElementById("form").addEventListener("submit", function(e) {
      e.preventDefault();
      const dados = {
        descricao: this.descricao.value,
        valor: this.valor.value,
        data: this.data.value
      };
      console.log("Dados enviados:", dados);
      fecharModal();
    });
  </script>

</body>
</html>
